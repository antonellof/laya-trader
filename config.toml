# laya-trader: Laya MLX reads market signals and returns P(bullish); each market's strategy
# turns it into LONG / SHORT / CLOSE / HOLD on a paper account.
# Paper only. No API keys, no real orders.

interval_seconds = 1.0            # one decision round per interval
model = "aac6fef/laya-multilingual-mlx"

[paper]
capital_usdt = 1000.0             # per asset

[prompt]                          # what Laya is asked; see promptlab.py for how it was chosen
question = "Is the short-term outlook for this asset bullish?"
format = "good_bad"               # "good_bad" or "lists"
memory_trades = 0                 # default for markets that don't set their own (0 = no memory)

# --- Crypto: Binance public data, trades 24/7 -----------------------------------------------
[crypto]
symbols = ["BTC", "ETH", "SOL"]   # quoted against USDT
kline_interval = "1h"             # 15m traded too often: fees ate the returns over a year
fee_pct = 0.05                    # per side, % (Binance USD-M futures taker 0.05%)
memory_trades = 10                # Laya reads the last 10 closed trades on the coin and their outcome

[crypto.strategy]                 # faster futures profile, tested on 9 unseen months (see README)
signal = "laya"                   # "laya" or "votes" (the four trend votes; did better on crypto)
market = "futures"                # "spot": long only, 1x   |   "futures": long + short, leverage, funding
direction = "trend"               # "trend": long when bullish   |   "reversion": long when oversold
enter_above = 0.65                # P(bullish) at or above: bullish signal
enter_below = 0.20                # P(bullish) at or below: bearish signal
trend_filter = "htf"              # "htf": only trade with the higher-timeframe trend (4h EMA20 vs EMA50)
risk_pct = 1.5                    # % of equity at risk per trade; ~0.5x equity on 1h crypto
max_leverage = 1.0                # 2x and 3x lost 17-35% over 9 test months
stop_loss_atr = 4                 # stop distance in ATR14 from entry; 0 = no stop
take_profit_atr = 0               # take-profit distance in ATR14; 0 = none
max_hold_candles = 70             # close after this many candles (70 x 1h = ~3 days); 0 = off
cooldown_seconds = 7200           # 2h between trades (was 4h)
# Protection (0 = off). Stops don't change the position size; sizing_atr does.
sizing_atr = 3.0                  # size = equity x risk_pct / (sizing_atr x ATR14), capped
stop_loss_pct = 0                 # fixed stop, % below/above the entry
trailing_stop_atr = 0             # stop that follows the best price since entry
breakeven_after_atr = 0           # once this far in profit, the stop moves to the entry
loss_cooldown_seconds = 0         # no new entry for this long after a losing trade
max_entry_atr_ratio = 0           # no new entry while ATR3 / ATR14 is above this
pause_drawdown_pct = 0            # circuit breaker: no new entries after equity falls this far
pause_seconds = 259200            # ... for this long

# --- Stocks: S&P 500 names via Yahoo Finance, regular US session only -----------------------
[stocks]
symbols = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "JPM", "XOM"]
benchmark = "SPY"                 # for relative strength
kline_interval = "1h"             # the candle size validated over a year (walkforward.py --rolling)
fee_pct = 0.02                    # commission-free brokers; this approximates the spread
poll_seconds = 30                 # Yahoo is unofficial, and hourly candles need no faster polling
memory_trades = 3                 # Laya reads the last 3 closed trades on the stock and their outcome

[stocks.strategy]                 # a year of monthly out-of-sample tests (see README)
signal = "laya"                   # "laya" or "votes"
market = "spot"                   # long only (shorting stocks needs a margin account)
direction = "reversion"
enter_above = 0.55
enter_below = 0.30
trend_filter = "none"             # "htf": only trade with the daily trend (EMA20 vs EMA50)
risk_pct = 3.0                    # full-size positions (capped at 1x): tested best over a year
max_leverage = 1.0
stop_loss_atr = 0
take_profit_atr = 0
max_hold_candles = 0
cooldown_seconds = 3600           # 1h between trades (4h before; 1h was slightly better)
# Protection (0 = off). Stops don't change the position size; sizing_atr does.
sizing_atr = 3.0                  # size = equity x risk_pct / (sizing_atr x ATR14), capped
stop_loss_pct = 0                 # fixed stop, % below/above the entry
trailing_stop_atr = 0             # stop that follows the best price since entry
breakeven_after_atr = 0           # once this far in profit, the stop moves to the entry
loss_cooldown_seconds = 0         # no new entry for this long after a losing trade
max_entry_atr_ratio = 0           # no new entry while ATR3 / ATR14 is above this
pause_drawdown_pct = 0            # circuit breaker: no new entries after equity falls this far
pause_seconds = 259200            # ... for this long

[context]                         # live-only sources: no history, so backtests can't include them
whale_alerts = false              # large transfers onto / off exchanges (Whale Alert, crypto)
news = false                      # latest headlines per asset, read by Laya as text (CoinJournal RSS)

[refresh]                         # slow sources do not need a request every second
context_seconds = 60              # higher-timeframe candles, funding, open interest, VIX, ...
fear_greed_seconds = 600
news_seconds = 300
