# laya-trader: Laya MLX reads market signals and returns P(bullish); each market's strategy
# turns it into LONG / SHORT / CLOSE / HOLD on a paper account.
# Paper only. No API keys, no real orders.

interval_seconds = 1.0            # one decision round per interval
model = "aac6fef/laya-multilingual-mlx"

[paper]
capital_usdt = 1000.0             # per asset

[prompt]                          # what Laya is asked; see promptlab.py for how it was chosen
question = "Is the short-term outlook for this asset bullish?"
format = "good_bad"               # "good_bad" or "lists"

# --- Crypto: Binance public data, trades 24/7 -----------------------------------------------
[crypto]
symbols = ["BTC", "ETH", "SOL"]   # quoted against USDT
kline_interval = "15m"            # candle size for the indicators
fee_pct = 0.1                     # per side, in percent (spot taker 0.1%, futures ~0.05%)

[crypto.strategy]                 # best Laya strategy in walkforward.py (see README)
market = "spot"                   # "spot": long only, 1x   |   "futures": long + short, leverage
direction = "reversion"           # "trend": long when bullish   |   "reversion": long when oversold
enter_above = 0.75                # P(bullish) at or above: bullish signal
enter_below = 0.15                # P(bullish) at or below: bearish signal
trend_filter = "none"             # "htf": only trade with the higher-timeframe trend (4h EMA20 vs EMA50)
risk_pct = 1.0                    # equity lost if the stop is hit; sets the position size
max_leverage = 3.0                # cap on position size / equity (futures only)
stop_loss_atr = 0                 # stop distance in ATR14 from entry; 0 = no stop
take_profit_atr = 0               # take-profit distance in ATR14; 0 = none
max_hold_candles = 0              # close after this many candles; 0 = no time limit
cooldown_seconds = 14400          # minimum time between two trades on one asset

# --- Stocks: S&P 500 names via Yahoo Finance, regular US session only -----------------------
[stocks]
symbols = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "JPM", "XOM"]
benchmark = "SPY"                 # for relative strength
kline_interval = "15m"
fee_pct = 0.02                    # commission-free brokers; this approximates the spread
poll_seconds = 15                 # Yahoo is unofficial: refresh candles every 15 s, not every second

[stocks.strategy]                 # best Laya strategy in walkforward.py (see README)
market = "spot"                   # long only (shorting stocks needs a margin account)
direction = "reversion"
enter_above = 0.55
enter_below = 0.30
trend_filter = "none"             # "htf": only trade with the daily trend (EMA20 vs EMA50)
risk_pct = 1.0
max_leverage = 1.0
stop_loss_atr = 0
take_profit_atr = 0
max_hold_candles = 0
cooldown_seconds = 14400

[context]                         # live-only sources: no history, so backtests can't include them
whale_alerts = false              # large transfers onto / off exchanges (Whale Alert, crypto)
news = false                      # latest headlines per asset, read by Laya as text (CoinJournal RSS)

[refresh]                         # slow sources do not need a request every second
context_seconds = 60              # higher-timeframe candles, funding, open interest, VIX, ...
fear_greed_seconds = 600
news_seconds = 300
